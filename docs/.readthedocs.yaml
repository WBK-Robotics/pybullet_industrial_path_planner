version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      - curl -L https://github.com/ompl/ompl/releases/download/1.7.0/wheels-ubuntu-latest-x86_64.zip -o ompl.zip
      - unzip ompl.zip
      - pip install ompl-1.7.0-cp312-cp312-manylinux_2_28_x86_64.whl

python:
  install:
    - requirements: requirements.txt